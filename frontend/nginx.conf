events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    server {
        listen       80;
        server_name  localhost;
        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # Backend API reverse proxy - only handle direct access, not federation
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # CRITICAL FIX: Connection stability and timeout settings
            proxy_connect_timeout       60s;
            proxy_send_timeout         60s;
            proxy_read_timeout         60s;
            proxy_buffers              8 16k;
            proxy_buffer_size          32k;
            proxy_busy_buffers_size    64k;
            proxy_temp_file_write_size 64k;
            
            # Keep-alive connections for better performance
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            
            # Forward federation headers if present (UPDATED with base64 encoding support)
            proxy_set_header X-User-Email $http_x_user_email;
            proxy_set_header X-User-Name $http_x_user_name;
            proxy_set_header X-User-Name-Encoding $http_x_user_name_encoding;  # CRITICAL: Support base64 encoding
            proxy_set_header X-User-ID $http_x_user_id;
            proxy_set_header X-Auth-Method $http_x_auth_method;
            
            # Add CORS headers for API requests - Support federation + standalone modes
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Email,X-User-Name,X-User-Name-Encoding,X-User-ID,X-Auth-Method" always;
            add_header Access-Control-Allow-Credentials "true" always;
            
            # Handle preflight requests
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,X-User-Email,X-User-Name,X-User-Name-Encoding,X-User-ID,X-Auth-Method" always;
                add_header Access-Control-Allow-Credentials "true" always;
                add_header Access-Control-Max-Age 1728000 always;
                add_header Content-Type "text/plain charset=UTF-8" always;
                add_header Content-Length 0 always;
                return 204;
            }
        }

        # Handle CORS preflight requests for frontend
        location / {
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
                add_header Access-Control-Max-Age 1728000 always;
                add_header Content-Type "text/plain charset=UTF-8" always;
                add_header Content-Length 0 always;
                return 204;
            }
            
            # Disable caching for development
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            try_files $uri $uri/ /index.html;
        }

        # Assets directory with CORS (specific location has higher priority)
        location ^~ /assets/ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
            add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
            
            # Disable caching for development
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            
            # Ensure JavaScript modules have correct MIME type
            location ~* \.m?js$ {
                add_header Content-Type "application/javascript" always;
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
                add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range" always;
                add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
                
                # Disable caching for JavaScript files
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
                add_header Pragma "no-cache" always;
                add_header Expires "0" always;
            }
            
            try_files $uri =404;
        }

        # Security headers
        # X-Frame-Options removed to allow federation iframe embedding from shell app
        # Instead, we'll use Content-Security-Policy frame-ancestors for more granular control
        # Temporarily disable CSP to test if it's causing the blocking issue
        # add_header Content-Security-Policy "frame-ancestors 'self' http://localhost:6600 http://localhost:7000 https://app1.lingaro.app https://lingarian.lingaro.app; connect-src 'self' http://localhost:6600 http://localhost:7000 https://app1.lingaro.app https://lingarian.lingaro.app http://host.containers.internal:* http://backend:*;" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}
